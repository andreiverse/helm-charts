{{- if and .Values.persistence.config.enabled .Values.persistence.config.hostPath (not .Values.persistence.config.existingClaim) }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "qbittorrent.fullname" . }}-config-pv
spec:
  capacity:
    storage: {{ .Values.persistence.config.size }}
  accessModes:
    - {{ .Values.persistence.config.accessMode }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.persistence.config.storageClass | default "" | quote }}       
  hostPath:
    path: {{ .Values.persistence.config.hostPath }}
{{- end }}
---
{{- if and .Values.persistence.config.enabled (not .Values.persistence.config.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qbittorrent.fullname" . }}-config-pvc
spec:
  accessModes:
    - {{ .Values.persistence.config.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.size }}
  {{- if .Values.persistence.config.hostPath }}
  volumeName: {{ include "qbittorrent.fullname" . }}-config-pv
  {{- end }}
  storageClassName: {{ .Values.persistence.config.storageClass | default "" | quote }}          
{{- end }}
---
{{- if and .Values.persistence.downloads.enabled .Values.persistence.downloads.hostPath (not .Values.persistence.downloads.existingClaim) }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "qbittorrent.fullname" . }}-downloads-pv
spec:
  capacity:
    storage: {{ .Values.persistence.downloads.size }}
  accessModes:
    - {{ .Values.persistence.downloads.accessMode }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.persistence.downloads.storageClass | default "" | quote }}         
  hostPath:
    path: {{ .Values.persistence.downloads.hostPath }}
{{- end }}
---
{{- if and .Values.persistence.downloads.enabled (not .Values.persistence.downloads.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qbittorrent.fullname" . }}-downloads-pvc
spec:
  accessModes:
    - {{ .Values.persistence.downloads.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.downloads.size }}
  {{- if .Values.persistence.downloads.hostPath }}
  volumeName: {{ include "qbittorrent.fullname" . }}-downloads-pv
  {{- end }}
  storageClassName: {{ .Values.persistence.downloads.storageClass | default "" | quote }}          
{{- end }}
