{{- if .Values.jackett.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arr.fullname" . }}-jackett
  labels:
    app.kubernetes.io/name: {{ include "arr.name" . }}-jackett
    helm.sh/chart: {{ include "arr.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "arr.name" . }}-jackett
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "arr.name" . }}-jackett
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: jackett
          image: "{{ .Values.jackett.image.repository }}:{{ .Values.jackett.image.tag }}"
          imagePullPolicy: {{ .Values.jackett.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.jackett.service.port }}
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: PUID
              value: {{ .Values.global.puid | quote }}
            - name: PGID
              value: {{ .Values.global.pgid | quote }}
          volumeMounts:
            {{- if .Values.jackett.persistence.config.enabled }}
            - name: config
              mountPath: /config
            {{- end }}
      volumes:
        {{- if .Values.jackett.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "arr.fullname" . }}-jackett-config
        {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
