{{- if .Values.radarr.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arr.fullname" . }}-radarr
  labels:
    app.kubernetes.io/name: {{ include "arr.name" . }}-radarr
    helm.sh/chart: {{ include "arr.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "arr.name" . }}-radarr
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "arr.name" . }}-radarr
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: radarr
          image: "{{ .Values.radarr.image.repository }}:{{ .Values.radarr.image.tag }}"
          imagePullPolicy: {{ .Values.radarr.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.radarr.service.port }}
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: PUID
              value: {{ .Values.global.puid | quote }}
            - name: PGID
              value: {{ .Values.global.pgid | quote }}
          volumeMounts:
            {{- if .Values.radarr.persistence.config.enabled }}
            - name: config
              mountPath: /config
            {{- end }}
            {{- range .Values.radarr.persistence.mounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.radarr.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "arr.fullname" . }}-radarr-config
        {{- end }}
        {{- range .Values.radarr.persistence.mounts }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .pvcName }}
        {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
