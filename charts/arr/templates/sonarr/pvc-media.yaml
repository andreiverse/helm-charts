{{- if and .Values.sonarr.enabled .Values.sonarr.persistence.media.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "arr.fullname" . }}-sonarr-media
  labels:
    app.kubernetes.io/name: {{ include "arr.name" . }}-sonarr
    helm.sh/chart: {{ include "arr.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - {{ .Values.sonarr.persistence.media.accessMode }}
  resources:
    requests:
      storage: {{ .Values.sonarr.persistence.media.size }}
  {{- if .Values.sonarr.persistence.media.storageClass }}
  {{- if (eq "-" .Values.sonarr.persistence.media.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: "{{ .Values.sonarr.persistence.media.storageClass }}"
  {{- end }}
  {{- end }}
  {{- if .Values.sonarr.persistence.media.hostPath }}
  volumeName: {{ include "arr.fullname" . }}-sonarr-media
  {{- end }}
{{- end -}}
