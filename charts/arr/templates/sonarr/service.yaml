{{- if .Values.sonarr.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arr.fullname" . }}-sonarr
  labels:
    app.kubernetes.io/name: {{ include "arr.name" . }}-sonarr
    helm.sh/chart: {{ include "arr.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.sonarr.service.type }}
  ports:
    - port: {{ .Values.sonarr.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "arr.name" . }}-sonarr
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}
